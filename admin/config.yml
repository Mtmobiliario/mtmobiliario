backend:
  name: git-gateway
  branch: main

media_folder: "assets/fotos"
public_folder: "assets/fotos"

collections:
  - name: "portfolio"
    label: "Portfólio de Obras"
    files:
      - label: "Trabalhos Realizados"
        name: "projetos"
        file: "portfolio.json"
        fields:
          - label: "Projetos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Título do Projeto", name: "titulo", widget: "string" }
              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options: ["Cozinhas", "Quartos & Closets", "Salas de Estar", "Casas de Banho", "Espaços Comerciais", "Mobiliário Avulso"]
                default: "Cozinhas"
              - { label: "Localização (ex: Matosinhos)", name: "local", widget: "string", required: false }
              - { label: "Fotografia da Obra", name: "foto", widget: "image" }
              - { label: "Descrição dos Materiais / Detalhes", name: "descricao", widget: "text", required: false }
