backend:
  name: github
  repo: Mtmobiliario/mtmobiliario
  branch: main

media_folder: "assets/fotos"
public_folder: "/assets/fotos"

collections:
  - name: "portfolio"
    label: "Portfólio de Obras"
    files:
      - file: "portfolio.json"
        label: "Projetos Publicados"
        name: "items"
        fields:
          - name: "items"
            label: "Lista de Obras"
            widget: "list"
            summary: "{{fields.titulo}} ({{fields.categoria}})"
            fields:
              - { label: "Título da Obra", name: "titulo", widget: "string" }
              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options: ["Cozinhas", "Roupeiros e Closets", "Sala", "Casa de Banho", "Comercial", "Outros"]
              - { label: "Localidade", name: "local", widget: "string", required: false }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Fotografia Principal (Capa)", name: "foto", widget: "image" }
              - label: "Galeria de Fotografias Extra"
                name: "galeria"
                widget: "list"
                required: false
                field: { label: "Fotografia", name: "imagem", widget: "image" }
